services:
  # PHP-FPM Application Container
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: istana-laundry-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/node_modules
    entrypoint: ["sh", "/var/www/docker/entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
    networks:
      - istana-network

  # Nginx Web Server Container
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - istana-network

  # MySQL Database Container
  db:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-istana_laundry}
      MYSQL_USER: ${DB_USERNAME:-istana_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-istana_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot_password",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - istana-network

  # Node.js for Vite Dev Server (development only)
  node:
    image: node:20-alpine
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles:
      - dev
    networks:
      - istana-network

networks:
  istana-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
