version: '3.8'

services:
  # PHP-FPM Application Container
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: istana-laundry-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    entrypoint: ["sh", "/var/www/docker/entrypoint.sh"]
    depends_on:
      - db
    networks:
      - istana-network

  # Nginx Web Server Container
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - istana-network

  # MySQL Database Container
  db:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: istana_laundry
      MYSQL_USER: istana_user
      MYSQL_PASSWORD: istana_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - istana-network

networks:
  istana-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
